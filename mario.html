<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Super Mario - AI Enemies</title>
    <style>
        body { margin: 0; overflow: hidden; background: #5C94FC; font-family: 'Arial Black', sans-serif; }
        canvas { display: block; margin: 0 auto; background: #5C94FC; }
        #stats { position: absolute; top: 10; left: 10; color: white; font-size: 20px; text-shadow: 2px 2px #000; padding: 15px; }
    </style>
</head>
<body>
    <div id="stats">TASE: <span id="lvl">1</span> | PUNKTE: <span id="score">0</span></div>
    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = 600;

    const config = { gravity: 0.8, jump: -16, speed: 6, enemySpeed: 2 };
    let score = 0;
    let level = 1;
    let scrollX = 0;

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    class Player {
        constructor() {
            this.x = 100; this.y = 400; this.w = 35; this.h = 45;
            this.vX = 0; this.vY = 0; this.grounded = false;
        }
        update(platforms) {
            if (keys['KeyD'] || keys['ArrowRight']) this.vX = config.speed;
            else if (keys['KeyA'] || keys['ArrowLeft']) this.vX = -config.speed;
            else this.vX = 0;

            if ((keys['KeyW'] || keys['ArrowUp'] || keys['Space']) && this.grounded) {
                this.vY = config.jump;
                this.grounded = false;
            }

            this.vY += config.gravity;
            this.x += this.vX;
            this.y += this.vY;

            // Kokkupõrked
            this.grounded = false;
            platforms.forEach(p => {
                if (this.x < p.x + p.w && this.x + this.w > p.x && this.y + this.h > p.y && this.y + this.h < p.y + p.h + this.vY) {
                    this.y = p.y - this.h;
                    this.vY = 0;
                    this.grounded = true;
                }
            });

            if (this.y > canvas.height) resetGame();
            if (this.x < 0) this.x = 0;
        }
        draw() {
            const screenX = this.x - scrollX;
            ctx.fillStyle = "#E4000F"; // Keha
            ctx.fillRect(screenX, this.y, this.w, this.h);
            ctx.fillStyle = "#0055ff"; // Tunked
            ctx.fillRect(screenX, this.y + 25, this.w, 20);
            ctx.fillStyle = "white"; // Silmad
            ctx.fillRect(screenX + (this.vX >= 0 ? 25 : 5), this.y + 10, 5, 10);
        }
    }

    class Enemy {
        constructor(x, y) {
            this.x = x; this.y = y; this.w = 35; this.h = 35; this.dead = false;
        }
        update(playerX) {
            if (this.dead) return;
            // AI: Liigu alati mängija suunas
            if (this.x < playerX) this.x += config.enemySpeed;
            else if (this.x > playerX) this.x -= config.enemySpeed;
        }
        draw() {
            if (this.dead) return;
            ctx.fillStyle = "#8B4513";
            ctx.fillRect(this.x - scrollX, this.y, this.w, this.h);
            ctx.fillStyle = "yellow";
            ctx.fillRect(this.x + 5 - scrollX, this.y + 5, 8, 8);
            ctx.fillRect(this.x + 22 - scrollX, this.y + 5, 8, 8);
        }
    }

    let p = new Player();
    let world = [];
    let enemies = [];
    let finishLine = 2500;

    function resetGame() {
        p = new Player();
        scrollX = 0;
        score = 0;
        level = 1;
        generateLevel();
    }

    function generateLevel() {
        world = [{ x: 0, y: 550, w: 3000, h: 50 }]; // Maapind
        enemies = [];
        for (let i = 0; i < 8; i++) {
            let platX = 400 + i * 300;
            let platY = 350 + Math.random() * 100;
            world.push({ x: platX, y: platY, w: 150, h: 20 });
            enemies.push(new Enemy(platX + 50, 515));
        }
        finishLine = 2800;
        document.getElementById('lvl').innerText = level;
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Kaamera
        if (p.x > 400) scrollX = p.x - 400;

        p.update(world);
        p.draw();

        world.forEach(plat => {
            ctx.fillStyle = "#AA5500";
            ctx.fillRect(plat.x - scrollX, plat.y, plat.w, plat.h);
        });

        enemies.forEach((e, index) => {
            e.update(p.x);
            e.draw();

            // Kokkupõrge vaenlasega
            if (!e.dead && p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
                if (p.vY > 2) { // Hüpe peale
                    e.dead = true;
                    p.vY = -12;
                    score += 100;
                    document.getElementById('score').innerText = score;
                } else {
                    resetGame();
                }
            }
        });

        // Finiš
        ctx.fillStyle = "gold";
        ctx.fillRect(finishLine - scrollX, 100, 10, 450);
        if (p.x > finishLine) {
            level++;
            generateLevel();
            p.x = 100;
        }

        requestAnimationFrame(loop);
    }

    generateLevel();
    loop();
</script>
</body>
</html>
